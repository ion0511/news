        let currentView = 'feed';

        const app = {

            repostTweet(id) {
                const tweet = tweetsData.find(t => t.id === id);
                if (tweet) { tweet.userReposted = !tweet.userReposted; tweet.stats.reposts += tweet.userReposted ? 1 : -1; this.render(); }

                    id: Date.now(), isPinned: false,
                    author: { name: '나', handle: 'citizen_kr', avatar: 'https://placehold.co/100x100/1d9bf0/ffffff?text=ME', verified: false },

            },

                const toast = document.getElementById('toast');

            },

            render() {
                const main = document.getElementById('mainContent');
                if (currentView === 'feed') { main.innerHTML = this.renderFeedHTML(); }
                else { main.innerHTML = this.renderArticleHTML(); }
            },
            renderFeedHTML() {
                let filtered = tweetsData;
                if (currentTab === 'following') { filtered = tweetsData.filter(t => t.isPinned || t.author.handle === 'Imperial_News'); }
                else if (currentTab === 'breaking') { filtered = tweetsData.filter(t => t.isPinned || t.content.includes('단독') || t.content.includes('속보')); }
                if (feedFilter === 'trending') { filtered = [...filtered].sort((a, b) => b.stats.likes - a.stats.likes); }

                return `
                    <div class="border-b border-[#2f3336] p-4 flex space-x-3 cursor-pointer hover:bg-[#16181c]/50 transition" onclick="app.openComposeModal()">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-bold text-white flex-shrink-0">나</div>
                        <div class="flex-1 py-2"><p class="text-[#71767b] text-base">황실 국혼에 대한 생각을 들려주세요...</p></div>
                        <button class="bg-[#1d9bf0] text-white px-4 py-1.5 rounded-full font-bold text-xs self-center">게시</button>
                    </div>
                    <div class="divide-y divide-[#2f3336]">
                        ${filtered.map(tweet => `
                            <article class="p-4 hover:bg-[#16181c]/40 transition cursor-pointer relative" onclick="${tweet.hasArticle ? 'app.openArticle(\'' + tweet.id + '\')' : ''}">
                                ${tweet.isPinned ? '<div class="text-xs text-[#71767b] font-semibold mb-2 flex items-center"><i class="fa-solid fa-thumbtack mr-2 text-[#1d9bf0]"></i>대한뉴스 고정됨</div>' : ''}
                                <div class="flex space-x-3">
                                    <img src="${tweet.author.avatar}" alt="Avatar" class="w-10 h-10 rounded-full object-cover flex-shrink-0">
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center space-x-1">
                                            <span class="font-bold text-sm text-[#e7e9ea] truncate">${tweet.author.name}</span>
                                            ${tweet.author.verified ? '<i class="fa-solid fa-circle-check text-[#1d9bf0] text-xs"></i>' : ''}
                                            <span class="text-[#71767b] text-xs">@${tweet.author.handle}</span>
                                            <span class="text-[#71767b] text-xs">·</span>
                                            <span class="text-[#71767b] text-xs hover:underline">${tweet.time}</span>
                                        </div>
                                        <p class="mt-1 text-sm text-[#e7e9ea] whitespace-pre-line leading-relaxed">${tweet.content}</p>
                                        ${tweet.image ? `<div class="mt-3 rounded-2xl overflow-hidden border border-[#2f3336] max-h-[320px]"><img src="${tweet.image}" alt="Post image" class="w-full h-full object-cover"></div>` : ''}
                                        <div class="flex justify-between max-w-md mt-3 text-[#71767b] text-xs" onclick="event.stopPropagation()">
                                            <button class="flex items-center space-x-2 hover:text-[#1d9bf0] transition"><i class="fa-regular fa-comment"></i><span>${tweet.stats.replies}</span></button>
                                            <button onclick="app.repostTweet('${tweet.id}')" class="flex items-center space-x-2 ${tweet.userReposted ? 'text-green-500' : 'hover:text-green-500'} transition"><i class="fa-solid fa-retweet"></i><span>${tweet.stats.reposts}</span></button>
                                            <button onclick="app.likeTweet('${tweet.id}')" class="flex items-center space-x-2 ${tweet.userLiked ? 'text-pink-500' : 'hover:text-pink-500'} transition"><i class="${tweet.userLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i><span>${tweet.stats.likes}</span></button>
                                            <button class="flex items-center space-x-2 hover:text-[#1d9bf0] transition"><i class="fa-regular fa-chart-bar"></i><span>${tweet.stats.views}</span></button>
                                            <button class="hover:text-[#1d9bf0] transition"><i class="fa-regular fa-share-from-square"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </article>
                        `).join('')}
                    </div>
                `;
            },
            renderArticleHTML() {
                return `
                    <div class="sticky top-[53px] bg-black/90 backdrop-blur-md border-b border-[#2f3336] px-4 py-3 flex items-center justify-between z-30">
                        <button onclick="app.goHome()" class="flex items-center space-x-2 text-[#1d9bf0] font-semibold text-sm hover:underline"><i class="fa-solid fa-arrow-left"></i><span>피드로 돌아가기</span></button>
                        <span class="text-xs text-[#71767b] font-medium">대한뉴스 단독 기사</span>
                    </div>
                    <article class="p-5 border-b border-[#2f3336]">
                        <div class="flex items-center space-x-3 mb-4">
                            <div class="w-10 h-10 rounded-full bg-[#1d9bf0] flex items-center justify-center font-bold text-white">皇</div>
                            <div>
                                <h4 class="font-bold text-sm text-white">대한뉴스 공식보도</h4>
                                <p class="text-xs text-[#71767b]">2025년 10월 16일 오후 7:30 발행 · 조회수 154,230</p>
                            </div>
                        </div>
                        <h1 class="text-xl sm:text-2xl font-extrabold text-white leading-snug mb-4">
                            [단독/속보] "선황의 약속 지켰다"... 황태자 오시온, 한예고 재학 중인 일반인 여고생과 '전격 국혼' 발표
                        </h1>
                        <div class="bg-[#16181c] border-l-4 border-[#1d9bf0] p-4 rounded-r-xl mb-6 text-sm text-[#e7e9ea] space-y-2">
                            <p class="font-bold text-[#1d9bf0]">[기사 요약]</p>
                            <ul class="list-disc list-inside space-y-1 text-[#71767b] text-xs sm:text-sm">
                                <li>황실, 오늘 오전 긴급 브리핑... "황태자 비(妃) 최종 확정"</li>
                                <li>예비 황태자비는 한국예술고 3학년 미술과 재학생 '이여주' 양</li>
                                <li>평민 신분·고등학생 신분 국혼에 황실 내부 및 여론 화들짝</li>
                                <li>여론의 파장에도 변함없는 선황의 유교(遺敎)… '신의와 약속' 최우선</li>
                            </ul>
                        </div>
                        <div class="text-xs text-[#71767b] mb-6 pb-4 border-b border-[#2f3336]">[대한황실 취재팀 / 지은수 기자]</div>
                        <div class="mb-6 rounded-2xl overflow-hidden border border-[#2f3336]">
                            <img src="photo1.jpg" alt="황실 대변인실 제공" class="w-full object-cover">
                            <div class="p-2 bg-[#16181c] text-center text-xs text-[#71767b]">▲ 사진: 황실 대변인실 제공</div>
                        </div>
                        <div class="space-y-4 text-sm sm:text-base leading-relaxed text-[#e7e9ea]">
                            <p>대한민국 황실이 거센 여론의 파장을 무릅쓰고 황태자 오시온(19)의 전격 국혼(國婚)을 공식 발표했다. 상대는 놀랍게도 왕족이나 명문가 자제가 아닌, 일반 평민 신분의 고등학생으로 확인됐다.</p>
                            <p>황실 대변인실은 24일 오전 긴급 브리핑을 통해 "황태자 오시온 전하의 국혼을 예정대로 거행하기로 확정했다"며, "예비 황태자비는 현재 한국예술고등학교 미술과 3학년에 재학 중인 이여주 양"이라고 밝혔다.</p>
                            <h3 class="text-lg font-bold text-white pt-2 border-t border-[#2f3336]">■ "황실의 신의 지키겠다"… 15년 전 선황의 약조가 계기</h3>
                            <p>이번 국혼은 과거 선황(先皇)과 예비 황태자비 이여주 양의 평생지기였던 조부 사이에 맺어진 약조에 따른 것으로 알려졌다. 황실 관계자는 "선황 전하께서 생전에 남기신 친필 유교(遺敎)에 따라 국혼 추진이 결정됐다"며 "황실의 신의를 지키고 국민과의 약속을 이행하겠다는 황실의 의지가 반영된 결정"이라고 설명했다.</p>
                            <p>황태자 오시온은 현재 황실 특례 및 관례에 따라 황태자 신분을 유지하며 학업과 황실 공무를 병행 중이다. 황실 측은 "예비 황태자비 역시 학업(한국예술고 3학년)을 마칠 때까지 황실과 학교 측의 협조 아래 신변 보호 및 비공개 수업 구성을 적극 검토할 것"이라고 덧붙였다.</p>
                            <h3 class="text-lg font-bold text-white pt-2 border-t border-[#2f3336]">■ 학교·여론 들썩… "현대판 신데렐라" vs "황실 특권 재검토"</h3>
                            <p>한편, 황태자비의 출신교인 한국예술고등학교 미술과 일대는 속보가 보도된 직후부터 취재진과 인파가 몰려들며 큰 혼란을 예고하고 있다. 동급생들과 교진 역시 '전혀 예상하지 못했다'며 당혹감을 감추지 못하는 중이다.</p>
                            <p>갑작스러운 일반인 고교생의 황실 입성 소식에 인터넷과 SNS는 폭발적인 반응을 보이고 있다. 일각에서는 "현대판 신데렐라의 탄생"이라며 축하를 보내는 반면, 황태자비의 어린 나이와 평민 신분을 둘러싼 보수 진영의 반발 및 황실 제도에 대한 찬반 논쟁도 뜨거워지고 있다.</p>
                            <p>황실은 조만간 예비 황태자비의 공식 간택 절차 및 전통 국혼 일정, 그리고 황태자비로서의 공식 입궁 날짜를 추가 발표할 예정이다.</p>
                        </div>
                        <div class="mt-8 pt-4 border-t border-[#2f3336] text-xs text-[#71767b]">[ⓒ Imperial Times, 무단 전재 및 재배포 금지]</div>
                    </article>
                    <section class="p-4 bg-[#000000]">
                        <h3 class="font-bold text-base mb-4 flex items-center justify-between">
                            <span>실시간 네티즌 반응 및 댓글</span>
                            <span class="text-xs text-[#71767b] font-normal" id="commentCount">총 ${commentsData.length}개 반응</span>
                        </h3>
                        <div class="mb-6 flex space-x-3 bg-[#16181c] p-3 rounded-xl border border-[#2f3336]">
                            <div class="w-8 h-8 rounded-full bg-[#1d9bf0] flex items-center justify-center font-bold text-white text-xs flex-shrink-0">나</div>
                            <div class="flex-1">
                                <input type="text" id="commentInput" placeholder="이 기사에 대한 솔직한 생각을 남겨주세요..." class="w-full bg-transparent text-sm text-white placeholder-[#71767b] focus:outline-none">
                                <div class="flex justify-end mt-2">
                                    <button onclick="app.submitComment()" class="bg-[#1d9bf0] hover:bg-[#1a8cd8] text-white px-3 py-1 rounded-full text-xs font-bold transition">댓글 작성</button>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-4" id="commentsList">
                            ${commentsData.map(c => `
                                <div class="p-3 rounded-xl bg-[#16181c]/60 border border-[#2f3336] text-sm">
                                    <div class="flex justify-between items-center mb-1">
                                        <div class="flex items-center space-x-2">
                                            <span class="font-bold text-xs text-white">${c.author}</span>
                                            <span class="text-[10px] text-[#71767b]">@${c.handle}</span>
                                        </div>
                                        <span class="text-[10px] text-[#71767b]">${c.time}</span>
                                    </div>
                                    <p class="text-xs text-[#e7e9ea] mb-2">${c.text}</p>
                                    <div class="flex items-center space-x-4 text-[10px] text-[#71767b]">
                                        <button onclick="app.likeComment(${c.id})" class="hover:text-pink-500 transition flex items-center space-x-1"><i class="fa-regular fa-heart"></i><span>공감 ${c.likes}</span></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            },
            renderArticleComments() {
                const list = document.getElementById('commentsList');
                if (!list) return;
                list.innerHTML = commentsData.map(c => `
                    <div class="p-3 rounded-xl bg-[#16181c]/60 border border-[#2f3336] text-sm">
                        <div class="flex justify-between items-center mb-1">
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-xs text-white">${c.author}</span>
                                <span class="text-[10px] text-[#71767b]">@${c.handle}</span>
                            </div>
                            <span class="text-[10px] text-[#71767b]">${c.time}</span>
                        </div>
                        <p class="text-xs text-[#e7e9ea] mb-2">${c.text}</p>
                        <div class="flex items-center space-x-4 text-[10px] text-[#71767b]">
                            <button onclick="app.likeComment(${c.id})" class="hover:text-pink-500 transition flex items-center space-x-1"><i class="fa-regular fa-heart"></i><span>공감 ${c.likes}</span></button>
                        </div>
                    </div>
                `).join('');
                document.getElementById('commentCount').innerText = `총 ${commentsData.length}개 반응`;
            }
        };

        window.onload = () => { app.init(); };
    </script>
</body>
</html>
